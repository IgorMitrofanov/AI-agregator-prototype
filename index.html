  --wallet-badge-bg: #202124; --wallet-badge-fg: #f0f0f3; --wallet-badge-line: #45464b;

/* ==========================================================================

* { box-sizing: border-box; }

.glyph.f169 { width: 18px; height: 10px; } .glyph.f916 { width: 10px; height: 18px; } .glyph.f11 { width: 14px; height: 14px; }

/* ==========================================================================
   HISTORY (table)
   ========================================================================== */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }

table.hist { width: 100%; border-collapse: collapse; }

.hist .t { width: 34%; }
.hist-scene { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 16px; align-items: center; }
.hist-title-group { min-width: 0; }
.hist-mobile-meta { display: none; }
.hist .t .thumb { aspect-ratio: 16/10; }
.hist .t a { font-weight: 600; line-height: 1.35; }
.hist .t a:hover { text-decoration: underline; text-underline-offset: 3px; }
.history-publication { min-width: 160px; }
.history-publication-label { display: block; font-size: 13px; font-weight: 500; }
.history-publication small { display: block; margin-top: 4px; color: var(--text-muted); font-size: 12px; }
.history-publication > a { display: inline-flex; align-items: center; min-height: 32px; margin-top: 4px; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.st { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.st.generating::before { background: var(--warn); } .st.failed::before { background: var(--bad); }
.empty { padding: 64px 16px; text-align: center; border: 1px dashed var(--field-line); border-radius: var(--r-md); }
.empty h2 { font-size: var(--fs-h2); margin-bottom: 6px; }
.empty p { color: var(--text-muted); margin-bottom: 18px; }

/* ==========================================================================
   VIDEO PAGE
   ========================================================================== */
.crumb { margin-bottom: 18px; font-size: 14px; }
.crumb a { color: var(--text-muted); } .crumb a:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
.vgrid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 48px; align-items: start; }
.player { min-height: 160px; position: relative; margin: 0 auto; max-width: 100%; border-radius: var(--r-md); overflow: hidden; background: var(--surface-2); max-height: 72vh; }
.player img { width: 100%; height: 100%; object-fit: cover; }
.vside h1 { font-size: 30px; line-height: 1.15; letter-spacing: -0.01em; }
.vside .prompt { margin: 14px 0 20px; font-family: var(--serif); font-size: 18px; line-height: 1.5; color: var(--text); }
dl.facts { margin: 0 0 24px; border-top: 1px solid var(--line); }
dl.facts div { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); }
dl.facts dt { color: var(--text-muted); } dl.facts dd { margin: 0; font-weight: 500; text-align: right; }
.vside > .account-link { display: inline-flex; align-items: center; min-height: 44px; margin-bottom: 20px; }
.acts { display: flex; flex-direction: column; gap: 16px; }
.acts .row { display: flex; flex-wrap: wrap; gap: 16px; }
.acts .row .btn { flex: 1 1 140px; min-height: 44px; }

/* ==========================================================================
   PLANS
   ========================================================================== */
.plans { display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-areas: "opts sum" "rates sum"; gap: 0 56px; align-items: start; }
.plans > :nth-child(1) { grid-area: opts; } .plans > .rates-wrap { grid-area: rates; margin-top: 44px; } .plans > .sum { grid-area: sum; }
.opts { border-top: 1px solid var(--field-line); margin-top: 18px; }
.opt { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 18px 8px 18px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.opt:hover { background: var(--surface-2); }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt .dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--field-line); display: grid; place-items: center; }
.opt:has(input:checked) .dot { border-color: var(--accent); }
.opt:has(input:checked) .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.opt:has(input:checked) { background: var(--soft); }
.opt b { font-family: var(--serif); font-weight: 500; font-size: 24px; letter-spacing: -0.01em; }
.opt .d { color: var(--text-muted); font-size: 14px; }
.opt .p { font-size: 18px; font-weight: 600; text-align: right; }
.opt .p small { display: block; color: var(--text-muted); font-weight: 400; font-size: var(--fs-caption); }
.sum { position: sticky; top: 92px; }
.sum h2 { font-size: var(--fs-h2); margin-bottom: 4px; }
.sum .big { font-family: var(--serif); font-size: 44px; line-height: 1.1; letter-spacing: -0.02em; margin: 6px 0 2px; }
.bars { margin: 22px 0 24px; display: grid; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 84px minmax(0, 1fr) 76px; gap: 12px; align-items: center; font-size: 14px; }
.bar-row .track { height: 10px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar-row .track i { display: block; height: 100%; background: var(--fill); border-radius: 2px; }
.bar-row .v { text-align: right; font-weight: 600; }
.sum .fine { color: var(--text-muted); font-size: var(--fs-caption); margin-top: 12px; }
.yourplan { background: var(--soft); border-radius: var(--r-md); padding: 18px; margin-bottom: 20px; }
.yourplan b { font-family: var(--serif); font-weight: 500; font-size: 22px; display: block; }
.yourplan .row { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

table.rates { width: 100%; border-collapse: collapse; }
.rates th { font-weight: 500; text-align: left; font-size: var(--fs-caption); color: var(--text-muted); padding: 0 0 8px; border-bottom: 1px solid var(--field-line); }
.rates tbody th { font-size: var(--fs-body); color: var(--text); padding: 10px 0; border-bottom: 1px solid var(--line); font-weight: 600; }
.rates td { padding: 10px 0; border-bottom: 1px solid var(--line); }
.rates .r { text-align: right; }

/* ==========================================================================
   REFERRALS
   ========================================================================== */
.refgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: start; }
.sec-h { font-size: var(--fs-h2); margin-bottom: 14px; }
.linkrow { display: flex; flex-wrap: wrap; gap: 16px; }
.linkrow input { flex: 1 1 200px; min-width: 0; font-variant-numeric: tabular-nums; }
.funnel { display: grid; gap: 12px; margin: 22px 0 8px; }
.funnel-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 32px; gap: 12px; align-items: center; font-size: 14px; }
.funnel-row .track { height: 14px; background: var(--line); border-radius: 2px; overflow: hidden; }
.funnel-row .track i { display: block; height: 100%; background: var(--fill); }
.funnel-row .v { text-align: right; font-weight: 600; }
table.refs { width: 100%; border-collapse: collapse; margin-top: 6px; }
.refs th { text-align: left; font-weight: 500; font-size: var(--fs-caption); color: var(--text-muted); padding: 0 8px 8px 0; border-bottom: 1px solid var(--field-line); }
.refs td { padding: 11px 8px 11px 0; border-bottom: 1px solid var(--line); }
.refs td:last-child, .refs th:last-child { text-align: right; padding-right: 0; }

/* ==========================================================================
   SIGN IN
   ========================================================================== */
.signin { max-width: 440px; margin: 0 auto; padding: 96px 24px 72px; }
.signin h1 { font-size: 40px; line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 8px; }
.signin form { margin-top: 28px; display: grid; gap: 16px; }
.signin label { display: block; font-size: var(--fs-caption); color: var(--text-muted); margin-bottom: 6px; }
.signin .code { font-family: var(--serif); font-size: 32px; letter-spacing: 0.3em; text-align: center; font-variant-numeric: tabular-nums; }
.signin .row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: center; font-size: 14px; margin-top: 8px; }
.signin .row > .linkbtn { display: inline-flex; align-items: center; min-height: 44px; }

/* ==========================================================================
   DIALOG, TOAST
   ========================================================================== */
dialog { width: min(440px, calc(100vw - 32px)); background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: var(--r-md); padding: 28px; box-shadow: 0 24px 64px var(--shadow); }
dialog::backdrop { background: var(--scrim); }
dialog h2 { font-size: 26px; margin-bottom: 6px; }
dialog .lines { margin: 18px 0; border-top: 1px solid var(--line); }
dialog .lines div { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); }
dialog .lines .tot { font-weight: 600; font-size: 17px; }
dialog .pay { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--field-line); border-radius: var(--r-sm); margin-bottom: 20px; }
dialog .btns { display: flex; flex-wrap: wrap; gap: 16px; justify-content: flex-end; margin-top: 24px; }
.toasts { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; display: grid; gap: 8px; width: min(440px, calc(100vw - 32px)); }
.toast { display: flex; gap: 14px; align-items: center; padding: 12px 16px; background: var(--text); color: var(--bg); border-radius: var(--r-md); box-shadow: 0 12px 32px var(--shadow); font-size: 14px; }
.toast span { flex: 1; }
.toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; padding: 6px; }

/* ==========================================================================
   RESPONSIVE
   ========================================================================== */
@media (max-width: 900px) {
  .vgrid, .refgrid { grid-template-columns: minmax(0, 1fr); gap: 36px; }
  .plans { grid-template-columns: minmax(0, 1fr); grid-template-areas: "opts" "sum" "rates"; gap: 32px 0; }
  .plans > .rates-wrap { margin-top: 0; }
  .sum { position: static; }
  .ideas { grid-template-columns: minmax(0, 1fr); }

}

  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 12px; }
  .vcard .meta { flex-direction: column; gap: 0; }
  .page, .landing { --page-top: 24px; --page-inline: 16px; --page-title-size: 30px; padding-bottom: 48px; }
  .filters .search { width: 100%; margin-left: 0; order: 5; }
  .hist thead { display: none; }
  .hist, .hist tbody, .hist tr, .hist td { display: block; }
  .hist tr { padding: 14px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; }
  .hist td { padding: 0; border: 0; }
  .hist td.t { grid-column: 1 / -1; }

  .menu { position: absolute; right: 0; top: 52px; }
}
@media (prefers-reduced-motion: reduce) {

}
/* Account: a credit ledger beside a film contact sheet. Existing D tokens are preserved. */
.account-page { max-width: 1200px; }
.account-heading { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px; }

.account-status.good { color: var(--good); }

.account-ledger .account-number { text-align: right; white-space: nowrap; }

.account-ledger .account-op { display: block; font-weight: 600; max-width: 42ch; }
.account-ledger a.account-op:hover { text-decoration: underline; text-underline-offset: 3px; }
.account-ledger small { display: block; margin-top: 4px; color: var(--text-muted); font-size: 12px; max-width: 44ch; }

/* Neutral fills distinguish credit movement without introducing a new brand palette. */

/* The controller adds this only while the requested video is loading/buffering. */
.video-loading-indicator {
  position: absolute; top: 50%; left: 50%; z-index: 5;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 52px; height: 52px; padding: 12px; transform: translate(-50%, -50%);
  border: 1px solid var(--cinema-line); border-radius: 50%;
  background: var(--cinema-control); color: var(--cinema-text);
  pointer-events: none !important;
}
.video-loading-indicator[hidden] { display: none; }
.thumb:has(.reel-like-feedback.is-visible) > .video-loading-indicator { opacity: 0; }
.video-loading-ring {
  display: block; flex: none; width: 24px; height: 24px;
  border: 3px solid var(--cinema-line); border-top-color: var(--cinema-text); border-radius: 50%;
  animation: video-loading-turn 900ms linear infinite;
}
.video-loading-label { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@keyframes video-loading-turn { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .video-loading-indicator { width: auto; min-width: 52px; padding: 12px; border-radius: var(--r-sm); }
  .video-loading-ring { animation: none; }
  .video-loading-label { position: static; width: auto; height: auto; margin: 0; overflow: visible; clip-path: none; font-size: 12px; line-height: 1.4; }
}

const CREATE_PURCHASE_RETURN = "aurora-create-purchase-return-v1";

const purchaseOwner = () => String(S.user?.email || "").trim().toLowerCase();
const purchaseDraft = () => JSON.stringify(S.draft);
function clearCreatePurchaseReturn() {

}
function currentCreatePurchaseReturn() {

  if (!context || !S.signedIn || currentRoute().name !== "plans" || currentRoute().arg || context.token !== params.get("resume")
      || !/^[a-zA-Z0-9-]{8,80}$/.test(context.token || "") || context.owner !== purchaseOwner() || context.draft !== purchaseDraft()
      || !/^#\/create(?:\?gallery=(?:videos|community))?$/.test(context.path || "")
      || !Number.isFinite(context.createdAt) || Date.now() - context.createdAt > 60 * 60 * 1000 || context.createdAt > Date.now()
      || !Number.isFinite(context.scrollX) || !Number.isFinite(context.scrollY) || context.scrollX < 0 || context.scrollY < 0) return null;
  return context;
}
function buyCreditsForDraft() {

  const gallery = new URLSearchParams(location.hash.split("?")[1] || "").get("gallery");
  createPurchaseReturn = {
    token: typeof crypto.randomUUID === "function" ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`,
    owner: purchaseOwner(), draft: purchaseDraft(), createdAt: Date.now(),
    path: "#/create" + (["videos", "community"].includes(gallery) ? `?gallery=${gallery}` : ""),
    scrollX: Math.max(0, scrollX), scrollY: Math.max(0, scrollY),
  };
  try { sessionStorage.setItem(CREATE_PURCHASE_RETURN, JSON.stringify(createPurchaseReturn)); } catch (e) {}

function finishCreatePurchaseReturn(message) {

  if (!context) return false;
  go(context.path.slice(2));
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (location.hash !== context.path || !S.signedIn || purchaseOwner() !== context.owner || purchaseDraft() !== context.draft) return;
    const status = document.createElement("p");
    status.id = "purchase-return-status"; status.className = "account-hint"; status.setAttribute("role", "status");
    status.textContent = message + " Review the cost before generating.";
    $("#composer")?.after(status);
    window.scrollTo(context.scrollX, context.scrollY);
    const button = $("#go");
    if (!button) return;
    button.focus({ preventScroll: true });
    const rect = button.getBoundingClientRect(), header = $("#top").getBoundingClientRect().bottom;
    if (rect.top < header || rect.bottom > innerHeight) button.scrollIntoView({ block: "center", behavior: "instant" });
  }));

}

function checkout(o, kind) {

      if (sub) { const now = new Date().toISOString(), end = nextMonth(now); S.plan = { id: o.id, credits: o.credits, usd: o.usd, state: "active", periodStart: now, periodEnd: end, nextBillingAt: end }; }

  };
}

const ANALYTICS_DAY = 86400000;

  }

  button.onclick = () => {
    if (!Recognition) {

    }

    };
    session.onend = () => { if (recognition === session) reset(); };

      toast("Dictation could not start. Try again.");

    const session = recognition;
    recognition = null;
    session?.abort();
    button.onclick = null;
  };

  return `<div class="workspace-navigation-footer"><div class="workspace-theme"><div class="workspace-theme-heading"><span id="${prefix}-theme-label">Appearance</span><span class="workspace-theme-auto${automatic ? " is-auto" : ""}${autoMotion}" id="${prefix}-theme-auto" aria-hidden="${!automatic}">Auto</span></div><span class="sr" id="${prefix}-theme-help">Clear the selected theme to follow system appearance.</span><div class="workspace-theme-options" role="group" aria-labelledby="${prefix}-theme-label${automatic ? ` ${prefix}-theme-auto` : ""}" aria-describedby="${prefix}-theme-help">${["light", "dark"].map(theme => {
    const label = theme[0].toUpperCase() + theme.slice(1);
    const moving = workspaceThemeTransition?.theme === theme && workspaceThemeTransition.surface === prefix;
    return `<button type="button" data-workspace-theme="${theme}" data-workspace-surface="${prefix}" aria-pressed="${themePref() === theme}" title="${themePref() === theme ? 'Follow system appearance' : `${label} appearance`}"><span class="workspace-theme-glyph${moving ? " is-changing" : ""}">${icon(`theme${label}`, 17)}</span><span>${label}</span></button>`;
  }).join("")}</div></div>${S.signedIn ? `<button class="workspace-signout" type="button" id="${mobile ? "mobile-signout" : "signout"}">${icon("signOut", 18)}<span>Sign out</span></button>` : '<a class="btn primary workspace-signin" href="#/signin">Sign in</a>'}${REVIEW && S.signedIn && !mobile ? '<button class="linkbtn workspace-reset" id="reset" type="button">Reset workspace</button>' : ""}</div>`;
}
function renderWorkspaceChrome() {
  const panelScroll = $("#mobile-navigation")?.scrollTop || 0;
  const sidebarScroll = $("#workspace-sidebar .workspace-navigation")?.scrollTop || 0;
  document.body.classList.add("workspace-shell");
  let sidebar = document.getElementById("workspace-sidebar");
  if (!sidebar) {
    sidebar = document.createElement("aside"); sidebar.id = "workspace-sidebar"; sidebar.className = "workspace-sidebar"; sidebar.setAttribute("aria-label", "Workspace"); $("#top").before(sidebar);
  }
  sidebar.innerHTML = `<a class="logo sidebar-brand" href="#/home" aria-label="Loom, home">Loom</a><nav class="workspace-navigation" aria-label="Main navigation">${workspaceLinksMarkup()}</nav>${workspaceFooterMarkup()}`;
  $(".workspace-navigation", sidebar).scrollTop = sidebarScroll;
  const allowance = S.plan?.state === "active" ? (mobileChrome.matches ? walletCompact.format(S.plan.credits) : walletAmount(S.plan.credits)) : "";
  const period = mobileChrome.matches && allowance.length > 2 ? "mo" : "month";
  const wallet = S.signedIn ? `<a class="bal" href="${S.plan?.state === "active" ? "#/account/billing" : "#/plans"}" aria-label="${walletLabel()}" title="${fmt(S.balance)} credits"><span class="balance-amount"><b class="num" id="bal-n">${walletAmount(S.balance)}</b>${icon("credits", 16)}</span><span class="header-plan" id="header-plan">${S.plan?.state === "active" ? `<span><span class="wallet-status-text">Monthly</span></span><b class="num">${allowance}/${period}</b>` : '<b><span class="wallet-status-text">Free</span></b>'}</span></a>` : '<a class="btn primary workspace-header-signin" href="#/signin">Sign in</a>';
  const portrait = S.signedIn ? `<div class="acct workspace-profile"><a class="workspace-profile-link" id="profile-shortcut" href="#/account/profile" aria-label="Your profile" title="${esc(accountUser().name)}"><span class="workspace-avatar-frame">${accountAvatarMarkup(accountUser())}</span></a></div>` : "";
  $("#top").innerHTML = `<div class="top-in${S.signedIn ? " is-signed-in" : " is-guest"}"><button class="mobile-nav-btn" id="mobile-nav-btn" type="button" aria-expanded="${mobileNavOpen}" aria-controls="mobile-navigation" aria-label="${mobileNavOpen ? "Close navigation" : "Open navigation"}">${icon(mobileNavOpen ? "x" : "navigation", 22)}</button><a class="logo" href="#/home" aria-label="Loom, home">Loom</a><span class="workspace-location">Workspace</span>${wallet}${portrait}</div><nav class="mobile-navigation" id="mobile-navigation" aria-label="Main navigation" ${mobileNavOpen ? "" : "hidden"}><div class="mobile-navigation-content">${S.signedIn ? `<p class="workspace-mobile-name">${esc(accountUser().name)}</p>` : ""}${workspaceLinksMarkup(true)}${workspaceFooterMarkup(true)}</div></nav>`;
  document.body.classList.toggle("workspace-nav-open", mobileNavOpen && mobileChrome.matches);
  if (mobileNavOpen && mobileChrome.matches) $("#mobile-navigation").scrollTop = panelScroll;
}
renderChrome = renderWorkspaceChrome;

const workspaceHeaderObserver = new ResizeObserver(() => {
  document.documentElement.style.setProperty("--workspace-header-height", `${$("#top").getBoundingClientRect().height}px`);
});
workspaceHeaderObserver.observe($("#top"));
for (const type of ["animationend", "animationcancel"]) document.addEventListener(type, event => {
  if (["workspace-theme-auto-enter", "workspace-theme-auto-leave"].includes(event.animationName)) event.target.classList.remove("is-entering", "is-leaving");
});
document.addEventListener("click", event => {
  const button = event.target.closest("[data-workspace-theme]");
  if (!button) return;
  const surface = button.dataset.workspaceSurface;
  const previous = themePref(), selected = button.dataset.workspaceTheme;
  const next = previous === selected ? "auto" : selected;
  workspaceThemeTransition = { theme: selected, surface, autoChanged: (previous === "auto") !== (next === "auto") };
  setTheme(next);
  workspaceThemeTransition = null;
  document.querySelector(`[data-workspace-theme="${button.dataset.workspaceTheme}"][data-workspace-surface="${surface}"]`)?.focus({ preventScroll: true });
});
document.addEventListener("keydown", event => {
  if (event.key !== "Tab" || !mobileNavOpen || !mobileChrome.matches) return;
  const controls = $$("#mobile-navigation a, #mobile-navigation button").filter(node => !node.hidden && node.getClientRects().length);
  const first = $("#mobile-nav-btn"), last = controls.at(-1);
  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
});

/* Sign-in choices; the Google action remains a recoverable unavailable state. */
function signinGoogleIcon() {
  return '<svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M21.6 12.2c0-.7-.1-1.4-.2-2.1H12v3.7h5.4a4.6 4.6 0 0 1-2 3.1c-.9.6-2 1-3.4 1a6 6 0 1 1 0-12c1.5 0 2.7.5 3.8 1.5l2.8-2.8A9.7 9.7 0 0 0 12 2a10 10 0 1 0 0 20c2.8 0 5.1-.9 6.8-2.5 1.9-1.7 2.8-4.2 2.8-7.3Z"/></svg>';
}

function viewSignin(main) {
  let step = 1, email = "", googleTimer = null, disposed = false;
  const stopGoogle = () => {
    clearTimeout(googleTimer); googleTimer = null;
    const button = $("#signin-google", main);
    if (button?.hasAttribute("aria-busy")) {
      button.disabled = false; button.removeAttribute("aria-busy");
      button.innerHTML = `${signinGoogleIcon()}<span>Continue with Google</span>`;
    }
  };
  const draw = (focusInput = false) => {
    stopGoogle();
    main.innerHTML = `<div class="signin signin-options"><h1 id="title" tabindex="-1">${step === 1 ? "Sign in to Loom" : "Check your email"}</h1>
      <p class="muted">${step === 1 ? "Sign in or create an account." : `Enter the verification code for ${esc(email)}.`}</p>
      ${step === 1 ? `<button class="btn signin-google" type="button" id="signin-google">${signinGoogleIcon()}<span>Continue with Google</span></button>
        <div class="signin-google-status" id="signin-google-status" hidden><p role="alert">Google sign-in is unavailable right now.</p><button class="btn" id="signin-email-fallback" type="button">Continue with email</button></div>
        <div class="signin-divider" aria-hidden="true"><span>Or</span></div>` : ""}
      <form id="sf" novalidate>${step === 1 ? `<div><label for="em">Email</label><input id="em" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" value="${esc(email)}"><p class="err" id="e" role="alert" hidden>${icon("warn", 14)}Enter a valid email, like you@example.com.</p></div><button class="go" type="submit" style="justify-content:center">Send code</button>`
        : `<div><label for="cd">6-digit code</label><input class="code" id="cd" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"><p class="err" id="e" role="alert" hidden>${icon("warn", 14)}Enter all 6 digits.</p></div><button class="go" type="submit" style="justify-content:center">Sign in</button>
        <div class="row"><button class="linkbtn" type="button" id="resend">Send a new code</button><button class="linkbtn" type="button" id="change">Use another email</button></div>`}</form>
      <p class="signin-terms muted">By continuing you accept the <a class="linkbtn" href="#/terms">Terms of service</a> and the <a class="linkbtn" href="#/privacy">Privacy policy</a>.</p></div>`;
    (matchMedia("(max-width: 1000px), (pointer: coarse)").matches && !focusInput ? $("#title") : step === 1 ? $("#em") : $("#cd")).focus({ preventScroll: true });
    if (step === 1) {
      const button = $("#signin-google"), status = $("#signin-google-status");
      button.onclick = () => {
        if (googleTimer) return;
        const hadFocus = document.activeElement === button;
        button.disabled = true; button.setAttribute("aria-busy", "true");
        button.innerHTML = `${signinGoogleIcon()}<span>Connecting…</span>`;
        status.hidden = true;
        googleTimer = setTimeout(() => {
          googleTimer = null;
          if (disposed || !button.isConnected) return;
          button.disabled = false; button.removeAttribute("aria-busy");
          button.innerHTML = `${signinGoogleIcon()}<span>Continue with Google</span>`;
          status.hidden = false;
          if (hadFocus && document.activeElement === document.body) button.focus({ preventScroll: true });
        }, REDUCED ? 200 : 500);
      };
      $("#signin-email-fallback").onclick = () => {
        status.hidden = true;
        $("#em").focus({ preventScroll: true });
      };
      $("#em").addEventListener("focus", () => { stopGoogle(); status.hidden = true; });
    }
    $("#sf").onsubmit = event => {
      event.preventDefault(); stopGoogle();
      if (step === 1) {
        const value = $("#em").value.trim();
        if (!/^\S+@\S+\.\S+$/.test(value)) {
          $("#e").hidden = false; $("#em").setAttribute("aria-invalid", "true"); $("#em").focus(); return;
        }
        email = value; step = 2; draw(true);
      } else {
        if (!/^\d{6}$/.test($("#cd").value)) { $("#e").hidden = false; $("#cd").focus(); return; }
        if (S.user.email !== email) {
          S = seed(); S.balance = 0; S.transactions = []; S.videos = []; S.nextTransactionId = 1; S.draft.prompt = "";
          S.user = { name: "New creator", initials: "NC", email, notifications: { completed: true, receipts: true } };
        }
        S.signedIn = true; save();
        go(communityLikeContinuation(communitySetupContinuation(signInDestination(afterSignIn))));
        afterSignIn = "create"; toast("Signed in.");
      }
    };
    if (step === 2) {
      $("#resend").onclick = () => toast("Check your inbox for your verification code.");
      $("#change").onclick = () => { step = 1; draw(); };
    }
  };
  main.innerHTML = "";
  return () => {
    draw();
    return () => { disposed = true; stopGoogle(); };
  };
}


save();
applyTheme();
/* Start a new visit in Create; reload keeps an intentional financial review. */
const initialNavigationType = performance.getEntriesByType("navigation")[0]?.type;
const initialRoute = currentRoute();
if (["navigate", "back_forward"].includes(initialNavigationType) && (initialRoute.name === "plans" || (initialRoute.name === "account" && initialRoute.arg === "billing"))) history.replaceState(null, "", "#/create");
renderChrome();
route();
ensureTicker();
</script>
</body>
