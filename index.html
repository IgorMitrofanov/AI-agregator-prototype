<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora</title>
<meta name="theme-color" content="#ecebe8">
<script>
  /* Set the theme before first paint: stored choice, else the system setting. */
  (function () {
    var pref = "auto";
    try { pref = localStorage.getItem("aurora-theme") || "auto"; } catch (e) {}
    var dark = pref === "dark" || (pref === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   TOKENS. The only place with colour values. Change --brand to re-theme.
   Roles: bg, surface, surface-2, text, text-muted, line, field-line (3:1),
   accent (text and lines), fill + on-fill (buttons, selected), soft (selected container).
   ========================================================================== */
:root {
  --brand: #272727;
  color-scheme: light;
  /* Fallbacks for browsers without relative colour: the default brand only. */
  --bg: #ecebe8; --surface: #f5f4f1; --surface-2: #e3e2df; --text: #1b1b1e; --text-muted: #606068;
  --line: #cecdc9; --field-line: #787878; --accent: #333336; --fill: #272727; --on-fill: #ffffff;
  --fill-hover: #424245; --soft: #e3e2df; --good: #2f6b45; --warn: #85580f; --bad: #a3322a;
  --scrim: rgb(18 18 20 / 0.45); --shadow: rgb(18 18 20 / 0.16);
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-sm: 6px; --r-md: 12px; --r-pill: 10px;
  --fs-caption: 13px; --fs-body: 15px; --fs-lead: 17px; --fs-h2: 22px; --fs-h1: 44px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #101113; --surface: #191a1d; --surface-2: #242529; --text: #f3f3f5; --text-muted: #a7a7b0;
  --line: #323338; --field-line: #767680; --accent: #d6d6dc; --fill: #e4e4e8; --on-fill: #18181b;
  --fill-hover: #fafafa; --soft: #2b2c31; --good: #8cc7a0; --warn: #e0b565; --bad: #f08c82;
  --scrim: rgb(0 0 0 / 0.6); --shadow: rgb(0 0 0 / 0.5);
}
@supports (color: oklch(from red l c h)) {
  :root {
    --accent: oklch(from var(--brand) clamp(0.34, l, 0.50) clamp(0, c, 0.15) h);
    --fill: oklch(from var(--brand) clamp(0.30, l, 0.80) clamp(0, c, 0.17) h);
    --on-fill: oklch(from var(--fill) clamp(0.14, calc((0.56 - l) * 100), 0.98) 0 h);
    --fill-hover: oklch(from var(--fill) calc(l - 0.05) c h);
    --soft: oklch(from var(--brand) 0.91 clamp(0, calc(c * 0.15), 0.015) h);
    --good: oklch(0.42 0.10 155); --warn: oklch(0.47 0.10 70); --bad: oklch(0.45 0.16 28);
    --scrim: oklch(0.2 0 0 / 0.45); --shadow: oklch(0.2 0 0 / 0.16);
  }
  :root[data-theme="dark"] {
    --bg: #101113; --surface: #191a1d; --surface-2: #242529;
    --text: #f3f3f5; --text-muted: #a7a7b0; --line: #323338; --field-line: #767680;
    --accent: oklch(from var(--brand) clamp(0.76, l, 0.88) clamp(0, c, 0.14) h);
    --fill: oklch(from var(--brand) clamp(0.90, l, 0.95) clamp(0, c, 0.16) h);
    --on-fill: oklch(from var(--fill) clamp(0.14, calc((0.56 - l) * 100), 0.98) 0 h);
    --fill-hover: oklch(from var(--fill) calc(l + 0.05) c h);
    --soft: oklch(from var(--brand) 0.28 clamp(0, calc(c * 0.2), 0.025) h);
    --good: oklch(0.78 0.12 155); --warn: oklch(0.80 0.12 80); --bad: oklch(0.75 0.14 25);
    --scrim: oklch(0.1 0 0 / 0.6); --shadow: oklch(0.05 0 0 / 0.5);
  }
}

/* Pick button text from the fill's actual luminance, including coloured brands. */
@supports (color: color(from white xyz-d65 round(up, y, 1) y z)) {
  :root[data-theme="light"] {
    --on-fill: color(from var(--fill) xyz-d65 calc(0.95047 * round(up, 0.179 - y, 1)) round(up, 0.179 - y, 1) calc(1.08883 * round(up, 0.179 - y, 1)));
  }
}

/* ==========================================================================
   BASE
   ========================================================================== */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 var(--fs-body)/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; font-family: var(--serif); font-weight: 400; text-wrap: balance; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
main:focus, [tabindex="-1"]:focus { outline: none; }
.skip { position: absolute; left: 12px; top: -48px; z-index: 50; background: var(--fill); color: var(--on-fill); padding: 10px 16px; border-radius: var(--r-pill); }
.skip:focus { top: 12px; }
.ic { flex: none; }

/* ==========================================================================
   HEADER AND NAVIGATION
   ========================================================================== */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1200px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 24px; }
.logo { font-family: var(--serif); font-size: 26px; font-weight: 500; letter-spacing: -0.01em; }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 14px; border-radius: var(--r-pill); color: var(--text-muted); font-weight: 500; }
.nav a:hover { color: var(--text); }
.nav a[href="#/community"] { color: var(--text); font-weight: 600; }
.nav a[aria-current="page"] { background: var(--surface-2); color: var(--text); }
.bal { display: inline-flex; gap: 16px; align-items: center; min-height: 44px; padding: 8px 14px; border: 1px solid var(--field-line); border-radius: var(--r-pill); font-weight: 600; }
.balance-amount { display: inline-flex; gap: 6px; align-items: baseline; white-space: nowrap; }
.balance-amount > span { font-weight: 400; color: var(--text-muted); }
.header-plan { display: flex; flex-direction: column; gap: 3px; border-left: 1px solid var(--line); padding-left: 14px; font-size: 12px; line-height: 1.25; white-space: nowrap; }
.header-plan > span { color: var(--text-muted); font-weight: 400; }
.header-plan > b { font-weight: 500; }
.bal:hover { background: var(--surface-2); }
.acct { position: relative; }
.avatar { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--field-line); background: var(--surface); font-weight: 600; font-size: 13px; }
.avatar:hover, .avatar[aria-expanded="true"] { background: var(--surface-2); }
.menu { position: absolute; right: 0; top: 48px; width: 272px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: 0 16px 48px var(--shadow); padding: 8px; z-index: 30; }
.menu[hidden] { display: none; }
.menu .who { padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.menu .who b { display: block; font-weight: 600; }
.menu .who span { color: var(--text-muted); font-size: var(--fs-caption); }
.menu .who { overflow-wrap: anywhere; }
.menu .lab { padding: 4px 10px; color: var(--text-muted); font-size: var(--fs-caption); }
.menu .seg { margin: 0 6px 8px; width: calc(100% - 12px); }
.menu .item { display: flex; gap: 10px; align-items: center; width: 100%; padding: 10px; border: 0; background: none; border-radius: var(--r-sm); text-align: left; }
.menu .item:hover { background: var(--surface-2); }

.notice { background: var(--surface-2); border-bottom: 1px solid var(--line); }
.notice-in { max-width: 1200px; margin: 0 auto; padding: 8px 32px; display: flex; gap: 12px; align-items: center; font-size: var(--fs-caption); }
.notice-in p { flex: 1; }
.notice button { border: 0; background: none; padding: 6px 10px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

.tabbar { display: none; }
.site-foot { max-width: 1200px; margin: 0 auto; padding: 28px 32px 40px; border-top: 1px solid var(--line); display: flex; gap: 20px; flex-wrap: wrap; align-items: baseline; color: var(--text-muted); font-size: var(--fs-caption); }
.site-foot a { text-decoration: underline; text-underline-offset: 3px; } .site-foot a:hover { color: var(--text); }
.site-foot span:first-child { margin-right: auto; font-family: var(--serif); font-size: 16px; color: var(--text); }
.legal { max-width: 640px; margin: 0 auto; padding: 64px 24px 72px; } .legal h1 { font-size: 36px; margin-bottom: 12px; } .legal p { color: var(--text-muted); margin-bottom: 20px; }

/* ==========================================================================
   LAYOUT
   ========================================================================== */
main { display: block; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 32px; }
.hero { max-width: 920px; margin: 0 auto; padding: 48px 32px 0; }
h1.display { font-size: var(--fs-h1); line-height: 1.1; letter-spacing: -0.02em; }
.lead { color: var(--text-muted); font-size: var(--fs-lead); margin: 8px 0 28px; }
.creator-starts { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; margin: -12px 0 20px; font-size: 13px; }
.creator-starts > span { color: var(--text-muted); }
.creator-starts button { min-height: 44px; padding: 8px 0; border: 0; background: none; text-decoration: underline; text-underline-offset: 4px; font-weight: 500; }
.creator-starts button:hover { color: var(--accent); }
.creator-starts button span { color: var(--text-muted); margin-left: 4px; }
.page { max-width: 1200px; margin: 0 auto; padding: 40px 32px 72px; }
.page > header { margin-bottom: 28px; }
.page h1 { font-size: 36px; line-height: 1.15; letter-spacing: -0.015em; }
.page .sub { color: var(--text-muted); margin-top: 6px; max-width: 62ch; }

/* ==========================================================================
   FORM CONTROLS
   ========================================================================== */
.chip { display: inline-flex; gap: 8px; align-items: center; padding: 8px 14px; border: 1px solid var(--field-line); border-radius: var(--r-pill); background: transparent; font-weight: 500; font-size: 14px; min-height: 40px; }
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); color: var(--text); }
.btn { display: inline-flex; gap: 8px; align-items: center; justify-content: center; border: 1px solid var(--field-line); background: transparent; border-radius: var(--r-pill); padding: 10px 18px; font-weight: 600; min-height: 44px; }
.btn:hover { background: var(--surface-2); }
.btn.primary, .go { background: var(--fill); color: var(--on-fill); border-color: var(--fill); }
.btn.primary:hover, .go:hover { background: var(--fill-hover); border-color: var(--fill-hover); }
.btn[disabled], .go[disabled] { opacity: 0.6; cursor: default; }
.btn.danger { color: var(--bad); }
.go { border-radius: var(--r-pill); padding: 13px 26px; font-weight: 600; font-size: 16px; min-height: 48px; display: inline-flex; gap: 8px; align-items: center; border: 1px solid var(--fill); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.linkbtn:hover { color: var(--text); }
input[type="text"], input[type="email"], input[type="search"], textarea { width: 100%; background: var(--surface); border: 1px solid var(--field-line); border-radius: var(--r-sm); padding: 11px 14px; }
input::placeholder, textarea::placeholder { color: var(--text-muted); opacity: 1; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; font-size: var(--fs-caption); color: var(--text-muted); margin-bottom: 8px; }
.err { color: var(--bad); font-size: var(--fs-caption); margin-top: 6px; display: flex; gap: 6px; align-items: center; }
.err[hidden] { display: none; }

/* segmented radio groups: real radios, styled */
.seg { display: inline-flex; border: 1px solid var(--field-line); border-radius: var(--r-pill); overflow: hidden; background: var(--surface); }
.seg label, .seg > button { position: relative; flex: 1; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg label > span, .seg > button { display: flex; gap: 8px; align-items: center; justify-content: center; padding: 9px 14px; min-height: 40px; font-weight: 500; color: var(--text-muted); white-space: nowrap; }
.seg > button { border: 0; background: none; border-radius: 0; }
.seg label + label > span, .seg > button + button { border-left: 1px solid var(--line); }
.seg label:hover > span, .seg > button:hover { color: var(--text); background: var(--surface-2); }
.seg input:checked + span, .seg > button[aria-pressed="true"] { background: var(--soft); color: var(--text); font-weight: 600; }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--r-pill); }
.glyph { display: inline-block; border: 1.5px solid currentColor; border-radius: 2px; flex: none; }
.glyph.f169 { width: 18px; height: 10px; } .glyph.f916 { width: 10px; height: 18px; } .glyph.f11 { width: 14px; height: 14px; }

/* ==========================================================================
   COMPOSER
   ========================================================================== */
.composer { background: var(--surface); border: 1px solid var(--field-line); border-radius: var(--r-md); }
.composer textarea { border: 0; background: transparent; resize: none; padding: 20px 22px 6px; font-size: 18px; line-height: 1.5; min-height: 120px; border-radius: var(--r-md) var(--r-md) 0 0; }
.composer textarea:focus-visible { outline: none; }
.composer:has(textarea:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.composer .err { padding: 0 22px; margin-top: 0; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 14px 14px 22px; }
.tools .count { margin-right: auto; font-size: var(--fs-caption); color: var(--text-muted); }
.attached { display: inline-flex; gap: 8px; align-items: center; padding: 4px 6px 4px 4px; border: 1px solid var(--line); border-radius: var(--r-pill); font-size: var(--fs-caption); max-width: 220px; }
.attached img { width: 32px; height: 32px; object-fit: cover; border-radius: 50%; }
.attached span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attached button { border: 0; background: none; padding: 4px; display: grid; place-items: center; border-radius: 50%; color: var(--text-muted); }
.attached button:hover { color: var(--text); background: var(--surface-2); }
.attached[hidden] { display: none; }
.settings { display: grid; grid-template-columns: auto auto auto; justify-content: space-between; gap: 18px 24px; padding: 18px 14px 14px; }
.set .ruler { margin-top: 10px; min-width: 250px; }
.duration-range { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 12px; margin-top: 6px; }
.image-compatibility { padding: 0 22px 16px; }
.history-model { min-height: 44px; max-width: 100%; border: 1px solid var(--field-line); border-radius: var(--r-sm); background: var(--surface); color: var(--text); padding: 10px 36px 10px 12px; font: inherit; }
.ticks { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; margin-top: 4px; font-size: 12px; color: var(--text-muted); text-align: center; }
.strip { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; height: 14px; }
.strip i { background: var(--line); border-radius: 2px; transition: background-color 150ms ease-out; }
.strip i.on { background: var(--fill); }
.foot { display: flex; align-items: center; gap: 20px; padding: 14px 14px 14px 22px; border-top: 1px solid var(--line); }
.price { margin-right: auto; line-height: 1.3; }
.price b { display: block; font-family: var(--serif); font-weight: 500; font-size: 28px; letter-spacing: -0.01em; }
.price small { color: var(--text-muted); font-size: var(--fs-caption); }
.price small.warn { color: var(--bad); font-weight: 500; }

/* ==========================================================================
   GALLERY
   ========================================================================== */
.gallery { max-width: 1200px; margin: 0 auto; padding: 56px 32px 72px; }
.gtabs { display: flex; gap: 28px; align-items: baseline; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
.gtabs button { min-height: 44px; border: 0; border-bottom: 2px solid transparent; background: none; padding: 0 0 12px; margin-bottom: -1px; font-family: var(--serif); font-size: var(--fs-h2); color: var(--text-muted); }
.gtabs button:hover { color: var(--text); }
.gtabs button[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--text); }
.gtabs .all { display: inline-flex; align-items: center; min-height: 44px; margin-left: auto; font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 20px; }
.vcard h3 { font-family: var(--sans); font-size: var(--fs-body); font-weight: 600; margin-top: 12px; line-height: 1.35; }
.vcard .meta { color: var(--text-muted); font-size: 14px; display: flex; justify-content: space-between; gap: 8px; margin-top: 2px; }
.thumb { display: block; position: relative; aspect-ratio: 16/10; overflow: hidden; border-radius: var(--r-sm); background: var(--surface-2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.vcard:has(a.thumb:hover) h3 { text-decoration: underline; text-underline-offset: 3px; }
.badge { position: absolute; left: 10px; bottom: 10px; padding: 3px 9px; border-radius: var(--r-pill); background: var(--surface); color: var(--text); font-size: 12px; font-weight: 600; }
.badge.bad { color: var(--bad); }
.gen, .fail { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 18px; }
.gen .strip { height: 14px; }
.gen p, .fail p { font-size: 14px; color: var(--text-muted); }
.gen b { font-family: var(--serif); font-weight: 500; font-size: 20px; color: var(--text); display: block; }
.fail { border: 1px dashed var(--field-line); border-radius: var(--r-sm); }
.fail b { font-weight: 600; color: var(--bad); display: flex; gap: 6px; align-items: center; }
.ideas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 40px; }
.idea { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; align-items: center; padding: 16px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.idea:hover .idea-t { text-decoration: underline; text-underline-offset: 3px; }
.idea .thumb { aspect-ratio: 4/3; }
.idea-t { font-size: 16px; line-height: 1.45; }
.idea small { display: block; color: var(--text-muted); margin-top: 4px; font-size: var(--fs-caption); }

/* ==========================================================================
   HISTORY (table)
   ========================================================================== */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
.filters .search { width: 260px; margin-left: auto; }
table.hist { width: 100%; border-collapse: collapse; }
.hist th { text-align: left; font-weight: 500; color: var(--text-muted); font-size: var(--fs-caption); padding: 0 12px 10px 0; border-bottom: 1px solid var(--field-line); }
.hist td { padding: 12px 12px 12px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
.hist th.r, .hist td.r { text-align: right; padding-right: 0; }
.hist th.r + th, .hist td.r + td { padding-left: 28px; }
.hist .t { width: 34%; }
.hist-scene { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 16px; align-items: center; }
.hist-title-group { min-width: 0; }
.hist-mobile-meta { display: none; }
.hist .t .thumb { aspect-ratio: 16/10; }
.hist .t a { font-weight: 600; line-height: 1.35; }
.hist .t a:hover { text-decoration: underline; text-underline-offset: 3px; }
.history-publication { min-width: 160px; }
.history-publication-label { display: block; font-size: 13px; font-weight: 500; }
.history-publication small { display: block; margin-top: 4px; color: var(--text-muted); font-size: 12px; }
.history-publication > a { display: inline-flex; align-items: center; min-height: 32px; margin-top: 4px; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.st { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.st.generating::before { background: var(--warn); } .st.failed::before { background: var(--bad); }
.empty { padding: 64px 16px; text-align: center; border: 1px dashed var(--field-line); border-radius: var(--r-md); }
.empty h2 { font-size: var(--fs-h2); margin-bottom: 6px; }
.empty p { color: var(--text-muted); margin-bottom: 18px; }

/* ==========================================================================
   VIDEO PAGE
   ========================================================================== */
.crumb { margin-bottom: 18px; font-size: 14px; }
.crumb a { color: var(--text-muted); } .crumb a:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
.vgrid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 48px; align-items: start; }
.player { min-height: 160px; position: relative; margin: 0 auto; max-width: 100%; border-radius: var(--r-md); overflow: hidden; background: var(--surface-2); max-height: 72vh; }
.player img { width: 100%; height: 100%; object-fit: cover; }
.player.playing img { animation: push var(--dur, 8s) linear forwards; }
@keyframes push { to { transform: scale(1.12); } }
.pbar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: var(--surface); color: var(--text); }
.pbar .play { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--fill); color: var(--on-fill); display: grid; place-items: center; }
.pbar .track { flex: 1; height: 3px; background: var(--field-line); border-radius: 2px; overflow: hidden; }
.pbar .track i { display: block; height: 100%; width: 100%; transform: scaleX(0); transform-origin: left; background: var(--accent); }
.player.playing .track i { animation: fill var(--dur, 8s) linear forwards; }
@keyframes fill { to { transform: scaleX(1); } }
.pbar .tc { font-size: 13px; }
.sheet-h { font-size: var(--fs-h2); margin: 36px 0 14px; display: flex; gap: 12px; align-items: baseline; }
.sheet-h small { font-family: var(--sans); font-size: var(--fs-caption); color: var(--text-muted); }
.contact-sheet > summary { cursor: pointer; min-height: 44px; list-style: none; }
.contact-sheet > summary::-webkit-details-marker { display: none; }
.contact-sheet > summary::after { content: "+"; margin-left: auto; font-family: var(--sans); }
.contact-sheet[open] > summary::after { content: "−"; }
.sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 14px 10px; }
.cell .frame { aspect-ratio: 16/10; overflow: hidden; border-radius: 3px; background: var(--surface-2); outline: 2px solid transparent; outline-offset: 2px; transition: outline-color 150ms ease-out; }
.cell.now .frame { outline-color: var(--accent); }
.cell.now figcaption { color: var(--text); font-weight: 600; }
.cell .frame img { width: 100%; height: 100%; object-fit: cover; transform-origin: 58% 62%; transform: scale(var(--s, 1)); }
.cell figcaption { font-size: 13px; color: var(--text-muted); margin-top: 6px; }
.vside h1 { font-size: 30px; line-height: 1.15; letter-spacing: -0.01em; }
.vside .prompt { margin: 14px 0 20px; font-family: var(--serif); font-size: 18px; line-height: 1.5; color: var(--text); }
dl.facts { margin: 0 0 24px; border-top: 1px solid var(--line); }
dl.facts div { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); }
dl.facts dt { color: var(--text-muted); } dl.facts dd { margin: 0; font-weight: 500; text-align: right; }
.vside > .account-link { display: inline-flex; align-items: center; min-height: 44px; margin-bottom: 20px; }
.acts { display: flex; flex-direction: column; gap: 16px; }
.acts .row { display: flex; flex-wrap: wrap; gap: 16px; }
.acts .row .btn { flex: 1 1 140px; min-height: 44px; }

/* ==========================================================================
   PLANS
   ========================================================================== */
.plans { display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-areas: "opts sum" "rates sum"; gap: 0 56px; align-items: start; }
.plans > :nth-child(1) { grid-area: opts; } .plans > .rates-wrap { grid-area: rates; margin-top: 44px; } .plans > .sum { grid-area: sum; }
.opts { border-top: 1px solid var(--field-line); margin-top: 18px; }
.opt { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 18px 8px 18px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.opt:hover { background: var(--surface-2); }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt .dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--field-line); display: grid; place-items: center; }
.opt:has(input:checked) .dot { border-color: var(--accent); }
.opt:has(input:checked) .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.opt:has(input:checked) { background: var(--soft); }
.opt b { font-family: var(--serif); font-weight: 500; font-size: 24px; letter-spacing: -0.01em; }

.sum { position: sticky; top: 92px; }
.sum h2 { font-size: var(--fs-h2); margin-bottom: 4px; }
.sum .big { font-family: var(--serif); font-size: 44px; line-height: 1.1; letter-spacing: -0.02em; margin: 6px 0 2px; }
.bars { margin: 22px 0 24px; display: grid; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 84px minmax(0, 1fr) 76px; gap: 12px; align-items: center; font-size: 14px; }
.bar-row .track { height: 10px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar-row .track i { display: block; height: 100%; background: var(--fill); border-radius: 2px; }
.bar-row .v { text-align: right; font-weight: 600; }
.sum .fine { color: var(--text-muted); font-size: var(--fs-caption); margin-top: 12px; }
.yourplan { background: var(--soft); border-radius: var(--r-md); padding: 18px; margin-bottom: 20px; }
.yourplan b { font-family: var(--serif); font-weight: 500; font-size: 22px; display: block; }
.yourplan .row { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

table.rates { width: 100%; border-collapse: collapse; }
.rates th { font-weight: 500; text-align: left; font-size: var(--fs-caption); color: var(--text-muted); padding: 0 0 8px; border-bottom: 1px solid var(--field-line); }
.rates tbody th { font-size: var(--fs-body); color: var(--text); padding: 10px 0; border-bottom: 1px solid var(--line); font-weight: 600; }
.rates td { padding: 10px 0; border-bottom: 1px solid var(--line); }
.rates .r { text-align: right; }

/* ==========================================================================
   REFERRALS
   ========================================================================== */
.refgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: start; }
.sec-h { font-size: var(--fs-h2); margin-bottom: 14px; }
.linkrow { display: flex; flex-wrap: wrap; gap: 16px; }
.linkrow input { flex: 1 1 200px; min-width: 0; font-variant-numeric: tabular-nums; }
.funnel { display: grid; gap: 12px; margin: 22px 0 8px; }
.funnel-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 32px; gap: 12px; align-items: center; font-size: 14px; }
.funnel-row .track { height: 14px; background: var(--line); border-radius: 2px; overflow: hidden; }
.funnel-row .track i { display: block; height: 100%; background: var(--fill); }
.funnel-row .v { text-align: right; font-weight: 600; }
table.refs { width: 100%; border-collapse: collapse; margin-top: 6px; }
.refs th { text-align: left; font-weight: 500; font-size: var(--fs-caption); color: var(--text-muted); padding: 0 8px 8px 0; border-bottom: 1px solid var(--field-line); }
.refs td { padding: 11px 8px 11px 0; border-bottom: 1px solid var(--line); }
.refs td:last-child, .refs th:last-child { text-align: right; padding-right: 0; }

/* ==========================================================================
   SIGN IN
   ========================================================================== */
.signin { max-width: 440px; margin: 0 auto; padding: 96px 24px 72px; }
.signin h1 { font-size: 40px; line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 8px; }
.signin form { margin-top: 28px; display: grid; gap: 16px; }
.signin label { display: block; font-size: var(--fs-caption); color: var(--text-muted); margin-bottom: 6px; }
.signin .code { font-family: var(--serif); font-size: 32px; letter-spacing: 0.3em; text-align: center; font-variant-numeric: tabular-nums; }
.signin .row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: center; font-size: 14px; margin-top: 8px; }
.signin .row > .linkbtn { display: inline-flex; align-items: center; min-height: 44px; }

/* ==========================================================================
   DIALOG, TOAST
   ========================================================================== */
dialog { width: min(440px, calc(100vw - 32px)); background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: var(--r-md); padding: 28px; box-shadow: 0 24px 64px var(--shadow); }
dialog::backdrop { background: var(--scrim); }
dialog h2 { font-size: 26px; margin-bottom: 6px; }
dialog .lines { margin: 18px 0; border-top: 1px solid var(--line); }
dialog .lines div { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); }
dialog .lines .tot { font-weight: 600; font-size: 17px; }
dialog .pay { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--field-line); border-radius: var(--r-sm); margin-bottom: 20px; }
dialog .btns { display: flex; flex-wrap: wrap; gap: 16px; justify-content: flex-end; margin-top: 24px; }
.toasts { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; display: grid; gap: 8px; width: min(440px, calc(100vw - 32px)); }
.toast { display: flex; gap: 14px; align-items: center; padding: 12px 16px; background: var(--text); color: var(--bg); border-radius: var(--r-md); box-shadow: 0 12px 32px var(--shadow); font-size: 14px; }
.toast span { flex: 1; }
.toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; padding: 6px; }

/* ==========================================================================
   RESPONSIVE
   ========================================================================== */
@media (max-width: 900px) {

}

/* Reserve the shape of asynchronous lists. Cached routes do not flash skeletons. */
.skeleton { display: block; background: var(--line); border-radius: var(--r-sm); animation: skeleton-breathe 1.2s ease-in-out infinite alternate; }
.skeleton-line { height: 14px; width: 100%; }

.skeleton-line.medium { width: 65%; }
.skeleton-number { width: 220px; height: 72px; margin: 28px 0 36px; }

.skeleton-photo { aspect-ratio: 16 / 10; }
.skeleton-scenes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin: 32px 0; }
.skeleton-tabs { display: flex; gap: 28px; padding: 16px 0 24px; border-bottom: 1px solid var(--line); }
.skeleton-tabs span { width: 92px; height: 16px; }

.skeleton-ledger-row span { height: 16px; }
.skeleton-form { max-width: 640px; min-height: 720px; margin-top: 32px; }
.skeleton-field { margin: 24px 0 32px; height: 48px; }
.app-load-error { max-width: 640px; margin: 40px 0 200px; padding-top: 32px; border-top: 1px solid var(--line); }

.app-load-error p { margin: 12px 0 24px; color: var(--text-muted); max-width: 48ch; line-height: 1.6; }
@keyframes skeleton-breathe { from { opacity: 0.55; } to { opacity: 1; } }
@media (max-width: 900px) {

.estimate-visual img { width: 100%; height: 100%; min-height: 280px; object-fit: cover; flex: 1; filter: grayscale(1); }
.estimate-visual figcaption { display: flex; justify-content: space-between; gap: 16px; padding: 14px 20px; color: var(--text-muted); font-size: 12px; }
.estimate-story { padding: 36px 40px; min-width: 0; }
.estimate-budget-label { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
.estimate-result h3 { font-family: var(--serif); font-size: clamp(34px, 3.5vw, 46px); font-weight: 400; line-height: 1.08; letter-spacing: -0.015em; text-wrap: balance; }
.estimate-scene-settings { color: var(--text-muted); font-size: 15px; line-height: 1.65; margin-top: 16px; max-width: 38ch; }
.estimate-unit-cost { margin-top: 20px; font-size: 14px; line-height: 1.6; }
.estimate-unit-cost strong { font-weight: 500; }
.estimate-total { color: var(--text-muted); font-size: 13px; margin-top: 8px; line-height: 1.6; }
.estimate-allocation { margin-top: 24px; }
.estimate-allocation-track { height: 6px; background: var(--line); border-radius: 2px; overflow: hidden; }
.estimate-allocation-track > span { display: block; height: 100%; background: var(--text); }
.estimate-allocation-labels { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: var(--text-muted); margin-top: 10px; font-variant-numeric: tabular-nums; }
.estimate-use { min-height: 44px; margin-top: 24px; }
.plan-estimate .plan-estimate-result { color: var(--text); line-height: 1.7; margin-top: 20px; }
.plan-pending { padding: 20px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 0 28px; }
.plan-pending h3, #plan-change-review h3 { font-family: var(--sans); font-size: 16px; font-weight: 600; margin-bottom: 12px; }
.plan-pending p { color: var(--text-muted); line-height: 1.6; font-size: 14px; margin: 8px 0; }
.plan-pending .linkbtn { display: inline-flex; align-items: center; min-height: 44px; margin-top: 8px; }
#plan-change-review { border-top: 1px solid var(--line); margin-top: 24px; padding-top: 24px; }
#plan-change-review[hidden] { display: none; }
#plan-change-review dl { display: grid; gap: 16px; }
#plan-change-review dt { color: var(--text-muted); font-size: 13px; margin-bottom: 6px; }
#plan-change-review dd { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
#plan-change-review > p { color: var(--text-muted); font-size: 13px; line-height: 1.65; margin: 20px 0; }
.plan-review-actions { display: flex; flex-wrap: wrap; gap: 16px; }
.plan-review-actions .btn { min-height: 44px; }
@media (max-width: 900px) {
  .plan-layout { gap: 28px; grid-template-columns: minmax(0, 1.25fr) minmax(245px, 1fr); }
}
@media (max-width: 700px) {
  .plans-page .plan-current { flex-wrap: wrap; align-items: flex-start; gap: 16px; padding: 20px 0; }
  .plan-current h2 { font-size: 26px; }
  .plan-layout { display: flex; flex-direction: column; gap: 28px; }
  .plan-options, .plan-summary, .plan-estimate { width: 100%; }
  .plan-summary { position: static; padding: 24px; }
  .plans-page .opt { gap: 12px; padding: 18px 14px; }
  .plans-page .opt b { font-size: 21px; }
  .plan-summary-credits { font-size: 32px; }
  .estimate-example { grid-template-columns: minmax(0, 1fr); }
  .estimate-visual img { min-height: 0; height: auto; aspect-ratio: 16 / 10; flex: none; }
  .estimate-visual figcaption { padding: 12px 16px; }
  .estimate-story { padding: 28px 24px; }
  .estimate-result h3 { font-size: 38px; }
  .estimate-budget-label { margin-bottom: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  #estimate-slide { transition: none !important; }
}

.prototype-options { margin-top: 16px; color: var(--text-muted); font-size: var(--fs-caption); }
.prototype-options summary { cursor: pointer; padding: 8px 0; }
body:not(.review-mode) .prototype-options, body:not(.review-mode) .model-notice { display: none; }
.demo-option { display: flex; gap: 8px; align-items: center; min-height: 44px; }
.demo-option input { accent-color: var(--fill); width: 18px; height: 18px; }
.payment-error { padding: 12px; border: 1px solid var(--bad); border-radius: var(--r-sm); color: var(--bad); margin-top: 16px; }
.payment-error[hidden] { display: none; }
.model-provider { display: block; font-size: var(--fs-caption); color: var(--text-muted); margin-top: 2px; }
.public-nav { display: flex; align-items: center; gap: 20px; margin-left: auto; }

.account-link { text-decoration: underline; text-underline-offset: 3px; color: var(--accent); }
.model-notice { margin: 16px 0 4px; color: var(--text-muted); font-size: var(--fs-caption); }
.composer .model-notice { padding: 0 22px; }
.composer > .prototype-options { padding: 0 22px 12px; }
.site-foot .prototype-label { font-family: var(--sans); color: var(--text-muted); font-size: var(--fs-caption); }
@media (max-width: 700px) {
  .tabbar { grid-template-columns: repeat(5, 1fr); }
  .public-nav { gap: 12px; }
  .public-nav .btn { padding: 9px 14px; }
  .site-foot .prototype-label { flex-basis: 100%; }
}
@media (min-width: 701px) and (max-width: 760px) { .tabbar { grid-template-columns: repeat(5, 1fr); } }

}

    $("#publish-panel").hidden = false;
    trigger.hidden = true;
    trigger.setAttribute("aria-expanded", "true");
    if (scroll) $(".publication").scrollIntoView({ block: "start", behavior: "auto" });
    $("#publish-title").focus({ preventScroll: scroll });
  };
  trigger?.addEventListener("click", () => openPanel());
  $("#cancel-publish")?.addEventListener("click", () => { $("#publish-panel").hidden = true; trigger.hidden = false; trigger.setAttribute("aria-expanded", "false"); trigger.focus(); });
  $("#publish-title")?.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#confirm-publish").click(); } });
  $("#publish-panel")?.addEventListener("keydown", e => { if (e.key === "Escape") { e.preventDefault(); $("#cancel-publish").click(); } });
  $("#confirm-publish")?.addEventListener("click", () => {
    const caption = $("#publish-title").value.trim();
    if (!caption || caption.length > 120) { $("#publish-error").hidden = false; $("#publish-title").setAttribute("aria-invalid", "true"); $("#publish-title").focus(); return; }
    if (!S.signedIn || v.status !== "ready") return;
    const includePrompt = $("#publish-share-prompt").checked;
    const existing = getPublishedPost(v.id);
    if (existing) {
      existing.caption = caption;
      existing.includePrompt = includePrompt;
      if (includePrompt) existing.prompt = v.prompt;
      else delete existing.prompt;
      save(); route({ preserve: true }); $("#edit-publication-settings")?.focus({ preventScroll: true }); toast("Publication settings saved.");
      return;
    }
    const post = { id: `post-${Date.now().toString(36)}-${v.id}`, videoId: v.id, author: accountUser().name, caption, includePrompt, model: v.model, modelName: recordModel(v).name, providerName: recordModel(v).provider, len: v.len, quality: v.quality, format: v.format, img: v.img, createdAt: new Date().toISOString() };
    if (includePrompt) post.prompt = v.prompt;
    S.posts.push(post); save(); route({ preserve: true }); $("#view-publication")?.focus({ preventScroll: true }); toast("Your scene is published.", { label: "View", fn: () => go("community/" + post.id) });
  });
  $("#unpublish-video")?.addEventListener("click", () => unpublishPost(getPublishedPost(v.id)?.id));
  const params = new URLSearchParams(location.hash.split("?")[1] || "");
  if (params.get("publish") === "1" && v.status === "ready") {
    params.delete("publish");
    history.replaceState(null, "", location.hash.split("?")[0] + (params.size ? "?" + params.toString() : ""));
    openPanel(true);
  }
}
function viewCommunity(main, arg) {
  if (!arg || arg === "mine") {
    const mine = arg === "mine";
    main.innerHTML = `<div class="page"><header class="account-heading"><div><h1 id="title" tabindex="-1">${mine ? "Your publications" : "Community"}</h1><p class="sub">${mine ? "Your shared scenes. You can unpublish a scene without deleting your video." : "Find a scene for your next post. Use an open prompt and its settings, then make it yours."}</p></div><a class="btn primary" href="#/create">Create a video</a></header><nav class="community-tabs" aria-label="Community"><a href="#/community" ${!mine ? 'aria-current="page"' : ""}>All creators</a><a href="#/community/mine" ${mine ? 'aria-current="page"' : ""}>My publications</a></nav>${communityCards(100, mine)}</div>`;
    return null;
  }
  const p = communityPosts(false).find(x => x.id === arg);
  if (!p) { main.innerHTML = '<div class="page"><h1 id="title" tabindex="-1">Publication unavailable</h1><div class="publication-empty"><p>The creator may have removed this scene.</p><a class="btn" href="#/community">Back to community</a></div></div>'; return null; }
  const own = S.signedIn && S.posts.some(x => x.id === p.id);
  main.innerHTML = `<div class="page"><a class="linkbtn" href="#/community">Back to community</a><div class="community-detail"><div><div class="player"><img src="${IMG[p.img]}" alt="Scene preview: ${esc(p.caption)}"><button class="play" type="button" id="community-play" aria-label="Play preview">${icon("play", 24)}</button></div><div class="community-preview-strip">${[0, 1, 2, 3].map(i => `<figure><img src="${IMG[p.img]}" alt=""><figcaption class="num">${tc(Math.floor(p.len * i / 4))}</figcaption></figure>`).join("")}</div></div><aside><h1 id="title" tabindex="-1">${esc(p.caption)}</h1><div class="community-author"><span class="community-initials" aria-hidden="true">${esc(publicInitials(p.author))}</span>${esc(p.author)}</div>${communityMetrics(p, true)}<dl class="facts"><div><dt>Model</dt><dd>${esc(recordModel(p).name)}</dd></div><div><dt>Length</dt><dd class="num">${p.len} s</dd></div><div><dt>Frame</dt><dd>${esc(p.quality)} · ${esc(p.format)}</dd></div></dl><section class="community-prompt"><h2>${p.includePrompt ? "Creator’s prompt" : "A private prompt"}</h2><p>${p.includePrompt ? esc(p.prompt) : "The creator has chosen not to share the prompt."}</p>${p.includePrompt ? `<button class="btn primary" id="use-community-prompt" type="button">${S.signedIn ? "Use this setup" : "Sign in to use this setup"}</button>` : '<a class="btn" href="#/create">Create your own scene</a>'}</section>${own ? `<div class="row"><a class="linkbtn" href="#/video/${p.videoId}">Your original video</a><a class="linkbtn" id="publication-settings" href="#/video/${p.videoId}?publish=1">Publication settings</a><button class="linkbtn" id="unpublish-video" type="button">Unpublish</button></div>` : ""}</aside></div></div>`;
  return () => {
    let timer = null, frame = 0;
    const stop = () => { clearInterval(timer); timer = null; $("#community-play").innerHTML = icon("play", 24); $("#community-play").setAttribute("aria-label", "Play preview"); $$(".community-preview-strip figure").forEach(e => e.classList.remove("now")); };
    $("#community-play").onclick = () => { if (timer) { stop(); return; } frame = 0; recordCommunityView(p.id); $("#community-play").innerHTML = icon("pause", 24); $("#community-play").setAttribute("aria-label", "Pause preview"); $$(".community-preview-strip figure")[0].classList.add("now"); timer = setInterval(() => { frame++; if (frame >= 4) { stop(); return; } $$(".community-preview-strip figure").forEach((e, i) => e.classList.toggle("now", i === frame)); }, REDUCED ? 500 : 1000); };
    $("#unpublish-video")?.addEventListener("click", () => unpublishPost(p.id));
    $("#use-community-prompt")?.addEventListener("click", () => beginCommunitySetup(p.id));
    return () => clearInterval(timer);
  };
}

function renderModelPicker(d) {
  const m = model(d.model), providers = [...new Set(availableModels().map(x => x.provider))].sort();
  return `<section class="model-picker" aria-label="Selected model"><div><span class="catalog-label">Model</span><strong>${esc(m.name)}</strong><p>${esc(m.provider)} · ${fmt(m.rates[d.quality])} credits / second</p></div><button class="btn" id="browse-models" type="button" aria-haspopup="dialog">Change model</button></section>
    <dialog class="catalog-dialog" id="model-dialog" aria-labelledby="model-dialog-title"><header><div><h2 id="model-dialog-title">Choose a model</h2><p>Available settings follow your selection.</p></div><button class="catalog-close" id="close-model-dialog" type="button" aria-label="Close model catalog">${icon("x", 20)}</button></header><div class="catalog-toolbar"><label class="sr" for="model-search">Search models and providers</label><input id="model-search" type="search" placeholder="Search models or providers" autocomplete="off"><div class="catalog-filters"><div><label for="model-provider">Provider</label><select id="model-provider"><option value="all">All providers</option>${providers.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join("")}</select></div><div><label for="model-input">Starting point</label><select id="model-input"><option value="all">Text or image</option><option value="text">Text</option><option value="image">Image</option></select></div></div><p class="catalog-count" id="model-count" role="status"></p></div><div class="catalog-results" id="model-results"></div></dialog>`;
}
function initModelPicker() {
  const dialog = $("#model-dialog"), opener = $("#browse-models");
  if (!dialog || !opener) return () => {};
  const search = $("#model-search"), provider = $("#model-provider"), input = $("#model-input");
  const draw = () => {
    const q = search.value.trim().toLowerCase();
    const results = availableModels().filter(m => (!q || `${m.name} ${m.provider} ${m.tag || ""}`.toLowerCase().includes(q)) && (provider.value === "all" || m.provider === provider.value) && (input.value === "all" || (m.inputs || ["text", "image"]).includes(input.value)));
    $("#model-count").textContent = `${results.length} model${results.length === 1 ? "" : "s"}`;
    $("#model-results").innerHTML = results.length ? results.map(m => `<button type="button" class="catalog-option" data-pick-model="${esc(m.id)}" aria-pressed="${S.draft.model === m.id}"><span class="catalog-option-main"><strong>${esc(m.name)}</strong><span>${esc(m.provider)} · ${esc(m.tag || "Video generation")}</span><small>${m.qualities.map(esc).join(" / ")} · ${Math.min(...m.lengths)}–${Math.max(...m.lengths)} s</small></span><span class="catalog-option-side"><span class="num">From ${fmt(Math.min(...m.qualities.map(q => m.rates[q])))} credits / s</span>${S.draft.model === m.id ? `<b>${icon("check", 14)}Selected</b>` : ""}</span></button>`).join("") : '<div class="catalog-empty"><h3>No matching models</h3><p>Try a different name or clear the filters.</p><button class="btn" id="clear-model-filters" type="button">Clear filters</button></div>';
    $("#clear-model-filters")?.addEventListener("click", () => { search.value = ""; provider.value = "all"; input.value = "all"; draw(); search.focus(); });
  };
  opener.onclick = () => { search.value = ""; provider.value = "all"; input.value = "all"; draw(); dialog.showModal(); search.focus(); };
  $("#close-model-dialog").onclick = () => dialog.close();
  dialog.addEventListener("close", () => { if (opener.isConnected) opener.focus({ preventScroll: true }); });
  search.addEventListener("input", draw); provider.addEventListener("change", draw); input.addEventListener("change", draw);
  dialog.addEventListener("keydown", e => { if (e.key === "Enter" && e.target === search) { e.preventDefault(); $("[data-pick-model]", dialog)?.focus(); } });
  $("#model-results").onclick = e => {
    const button = e.target.closest("[data-pick-model]");
    if (!button) return;
    if (!isModelAvailable(button.dataset.pickModel)) { draw(); toast("This model is no longer available. Choose another model."); return; }
    S.draft.model = button.dataset.pickModel; normalizeDraft(S.draft); save(); dialog.close(); route({ preserve: true });
    $("#browse-models")?.focus({ preventScroll: true }); toast(`${model(S.draft.model).name} selected. Review the settings and cost.`);
  };
  return () => { if (dialog.open) dialog.close(); };
}


save();
applyTheme();
renderChrome();
route();
ensureTicker();
</script>
